name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # prevent one Python version failure cascading to cancel others
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: ~/.cache/pypoetry
          key: poetry-cache-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            poetry-cache-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry env use python
          poetry install --no-interaction

      - name: Sync lockfile if outdated
        if: matrix.python-version == '3.12' && github.event_name == 'push'
        run: |
          poetry lock
          if [ -n "$(git status --porcelain poetry.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add poetry.lock
            git commit -m "chore: auto-sync poetry.lock [skip ci]"
            git push
            echo "Lockfile was out of sync. Updated and pushed."
          fi

      - name: Ruff lint
        if: matrix.python-version == '3.12'
        run: poetry run ruff check src/

      - name: Ruff format check
        if: matrix.python-version == '3.12'
        run: poetry run ruff format --check src/

      - name: Mypy type check
        if: matrix.python-version == '3.12'
        run: poetry run mypy src/

      - name: Run tests
        run: poetry run pytest --cov=ssm_explorer --cov-report=term-missing
