name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Sync Lockfile if Outdated
        if: matrix.python-version == '3.12'
        run: |
          poetry lock
          if [ -n "$(git status --porcelain poetry.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add poetry.lock
            git commit -m "chore: auto-sync poetry.lock [skip ci]"
            git push
            echo "Lockfile was out of sync. Successfully updated and pushed to repository."
          fi

      - name: Cache Poetry cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ~/.cache/pypoetry
          key: poetry-cache-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            poetry-cache-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry env use python
          poetry install --no-interaction

      - name: Ruff lint
        if: matrix.python-version == '3.12'
        run: poetry run ruff check src/

      - name: Ruff format check
        if: matrix.python-version == '3.12'
        run: poetry run ruff format --check src/

      - name: Mypy type check
        if: matrix.python-version == '3.12'
        run: poetry run mypy src/

      - name: Run tests
        run: poetry run pytest --cov=ssm_explorer --cov-report=term-missing
