[tool.poetry]
name = "ssm-explorer"
version = "1.0.0"
description = "A professional AWS SSM Parameter Store explorer and filter CLI tool"
authors = ["Douklar DevOps Tools <github@hummatovic.com>"]
readme = "README.md"
license = "MIT"
keywords = ["aws", "ssm", "parameter-store", "cli", "devops"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
packages = [{include = "ssm_explorer", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
boto3 = "^1.38.0"
typer = {version = "^0.15.0", extras = ["all"]}
rich = "^14.0.0"
pydantic = "^2.11.0"
pydantic-settings = "^2.9.0"
prompt-toolkit = "^3.0.48"
tomli = {version = "^2.0.1", python = "<3.11"}

[tool.poetry.group.dev.dependencies]
pytest = ">=8.4,<10.0"
pytest-cov = "^6.1.0"
ruff = "^0.11.0"
mypy = "^1.16.0"
boto3-stubs = {version = "^1.38.0", extras = ["ssm"]}
pre-commit = "^4.2.0"

[tool.poetry.scripts]
ssm-explorer = "ssm_explorer.main:app"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "PT"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.semantic_release]
version_toml = ["pyproject.toml:tool.poetry.version"]
version_variables = ["src/ssm_explorer/__init__.py:__version__"]
branch = "main"
upload_to_pypi = false
build_command = "pip install poetry && poetry build"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
